<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
  <title>C++ WebAssembly UI — Dear ImGui</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d14; overflow: hidden; }

    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      height: 40px;
      background: rgba(20, 20, 36, 0.92);
      border-bottom: 1px solid #2a2a4a;
      backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px;
      font-family: system-ui, sans-serif;
    }
    #header h1 { font-size: 0.95rem; font-weight: 600; color: #7ec8e3; }
    #header span { font-size: 0.75rem; color: #666; }
    #header .badge {
      margin-left: auto;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: #1a3a2a;
      color: #4fc878;
      border: 1px solid #2a5a3a;
    }

    /* canvas fills everything below the header */
    canvas.emscripten {
      position: absolute;
      top: 40px; left: 0;
      width: 100%;
      height: calc(100vh - 40px);
      border: 0;
      display: block;
      image-rendering: optimizeSpeed;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    #canvas:focus { outline: none; }

    #loading {
      position: fixed; bottom: 12px; right: 12px;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem; color: #7ec8e3;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>C++ &#8594; WebAssembly</h1>
    <span>Dear ImGui &middot; SDL2 &middot; WebGL &middot; Emscripten</span>
    <span id="badge" class="badge">Loading...</span>
  </div>

  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

  <!-- Hidden input that gives the phone keyboard a real DOM target to focus -->
  <input id="imgui-kb" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="none" spellcheck="false"
         style="position:fixed;top:-200px;left:0;width:1px;height:1px;opacity:0;pointer-events:none;">
  <input id="pdf-file-input" type="file" accept=".pdf,application/pdf"
         style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
  <input id="img-file-input" type="file" accept="image/*" style="display:none">
  <input id="docx-file-input" type="file"
         accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
         style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">

  <script type="text/javascript">
    var Module = {
      preRun: [],
      postRun: [],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: (function() {
        return document.getElementById('canvas');
      })(),
      setStatus: function(text) {
        var badge = document.getElementById('badge');
        if (!text) {
          badge.textContent = 'Running';
          badge.style.background = '#1a3a2a';
          badge.style.color = '#4fc878';
          badge.style.borderColor = '#2a5a3a';
        } else {
          badge.textContent = text;
        }
        console.log('status: ' + text);
      },
      monitorRunDependencies: function(left) {},
      onRuntimeInitialized: function() {
        var inp  = document.getElementById('imgui-kb');
        var canv = document.getElementById('canvas');

        // ── Typed characters → ImGui ─────────────────────────────────────────
        inp.addEventListener('input', function(e) {
          var v = inp.value;
          for (var i = 0; i < v.length; i++) {
            var c = v.charCodeAt(i);
            // combine UTF-16 surrogate pairs into one codepoint
            if (c >= 0xD800 && c <= 0xDBFF && i + 1 < v.length) {
              var c2 = v.charCodeAt(i + 1);
              if (c2 >= 0xDC00 && c2 <= 0xDFFF) {
                c = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
                i++;
              }
            }
            Module.ccall('imgui_add_char', null, ['number'], [c]);
          }
          inp.value = '';
        });

        // ── Special keys, modifiers, repeats and releases → ImGui ────────────
        // Modifiers matter: Shift+Arrow / Shift+Click extend the selection,
        // Ctrl+C/V/X/A/Z drive clipboard and undo.  They never fire an 'input'
        // event, so they used to be invisible to ImGui (Ctrl was always 0).
        var KEY_MAP = {
          'Backspace':8,'Enter':13,'Tab':9,'Escape':27,
          'ArrowLeft':37,'ArrowRight':39,'ArrowUp':38,'ArrowDown':40,
          'Delete':46,'Home':36,'End':35,'PageUp':33,'PageDown':34,
          '.':190, ',':188, '-':189, '=':187
        };
        var MOD_MAP = {
          'ShiftLeft':16,'ShiftRight':16,
          'ControlLeft':17,'ControlRight':17,
          'AltLeft':18,'AltRight':18,
          'MetaLeft':91,'MetaRight':93
        };
        function keyCode(ev) {
          if (Object.prototype.hasOwnProperty.call(KEY_MAP, ev.key)) return KEY_MAP[ev.key];
          var code = ev.code || '';
          if (MOD_MAP[code] !== undefined) return MOD_MAP[code];
          if (/^Key[A-Z]$/.test(code))   return code.charCodeAt(3);
          if (/^Digit[0-9]$/.test(code)) return code.charCodeAt(5);
          return 0;
        }
        function sendKey(code, down) {
          Module.ccall('imgui_add_key', null, ['number','number'], [code, down ? 1 : 0]);
        }
        inp.addEventListener('keydown', function(e) {
          if (e.isComposing) return;              // let the IME finish first
          var code = keyCode(e);
          if (!code) return;
          sendKey(code, true);                    // ImGui repeats held keys itself
          if (e.ctrlKey || e.metaKey || code === 9) e.preventDefault();
        });
        inp.addEventListener('keyup', function(e) {
          var code = keyCode(e);
          if (code) sendKey(code, false);
        });
        window.addEventListener('blur', function() { sendKey(-1, 0); });
        inp.addEventListener('blur',    function() { sendKey(-1, 0); });

        // ── Paste: push real clipboard text into the document editor ─────────
        inp.addEventListener('paste', function(e) {
          var cd = e.clipboardData || window.clipboardData;
          if (!cd) return;
          var t = cd.getData('text');
          if (!t) return;
          e.preventDefault();
          Module.ccall('doc_paste_text', null, ['string'], [t]);
        });

        // ── Focus: the hidden input owns the keyboard (desktop + mobile) ─────
        canv.addEventListener('mousedown', function() { inp.focus(); });
        canv.addEventListener('touchend', function() {
          inp.focus(); // must be synchronous — iOS revokes gesture context on setTimeout
        }, { passive: true });

        // Hide keyboard when ImGui no longer wants text input
        setInterval(function() {
          if (document.activeElement === inp &&
              !Module.ccall('imgui_want_text_input', 'number', [], [])) {
            inp.blur();
          }
        }, 200);

        // PDF file input is wired up by the native-PDF script below

        // ── DOCX import: local file → wasm heap → document model ──────────
        // A picker created on demand works where a hidden, permanently-attached
        // input does not (iOS Safari and some Android WebViews ignore .click()
        // on display:none inputs).
        window.__docxImport = function (file) {
          var reader = new FileReader();
          reader.onload = async function (evt) {
            var bytes = new Uint8Array(evt.target.result);
            var ptr = Module._malloc(bytes.length);
            Module.HEAPU8.set(bytes, ptr);
            var n = Module.ccall('doc_import_docx', 'number', ['number', 'number'],
                                 [ptr, bytes.length]);
            Module._free(ptr);
            console.log('docx import: ' + file.name + ' -> ' + n);
            if (n < 0) alert('Could not read this .docx (code ' + n + ').\n' +
                             'It must be a modern Word/OOXML file, not a .doc.');
            else { await window.__docxLoadImages(); await window.__docxRenderMath(); }
          };
          reader.readAsArrayBuffer(file);
        };

        // Images live in the package as PNG/JPEG; decode them with the browser
        // and hand the RGBA back to the document model.
        // Display equations arrive as LaTeX from the importer; render them with
        // MathJax and attach the raster to their paragraph, like an image.
        window.__docxRenderMath = async function () {
          var n = Module.ccall('doc_imported_math_count', 'number', [], []);
          for (var i = 0; i < n; ++i) {
            try {
              var pi  = Module.ccall('doc_imported_math_para', 'number', ['number'], [i]);
              var tex = Module.ccall('doc_imported_math_tex', 'string', ['number'], [i]);
              if (pi < 0 || !tex) continue;
              if (!window.MathJax || !MathJax.tex2svgPromise) {
                await new Promise(function (res, rej) {
                  if (window.MathJax && MathJax.tex2svgPromise) return res();
                  var sc = document.createElement('script');
                  sc.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';
                  sc.onload = res; sc.onerror = rej;
                  document.head.appendChild(sc);
                });
                if (MathJax.startup && MathJax.startup.promise) await MathJax.startup.promise;
              }
              var node = await MathJax.tex2svgPromise(tex, { display: true });
              var svgEl = node.querySelector('svg');
              var svg = new XMLSerializer().serializeToString(svgEl);
              var vb = /viewBox="([-\d.]+) ([-\d.]+) ([-\d.]+) ([-\d.]+)"/.exec(svg);
              var wpt = vb ? parseFloat(vb[3]) / 1000 * 16 : 320;
              var hpt = vb ? parseFloat(vb[4]) / 1000 * 16 : 70;
              var cw = Math.max(8, Math.round(wpt));
              var ch = Math.max(8, Math.round(hpt));
              var img = new Image();
              img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
              await new Promise(function (res, rej) { img.onload = res; img.onerror = rej; });
              var c = document.createElement('canvas');
              c.width = cw; c.height = ch;
              var ctx = c.getContext('2d');
              ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch);
              ctx.drawImage(img, 0, 0, cw, ch);
              var data = ctx.getImageData(0, 0, cw, ch).data;
              var ptr = Module._malloc(data.length);
              Module.HEAPU8.set(data, ptr);
              Module.ccall('doc_attach_image', null, ['number','number','number','number'],
                           [pi, ptr, cw, ch]);
              Module._free(ptr);
            } catch (err) { console.log('math ' + i + ' failed: ' + err); }
          }
        };

        window.__docxLoadImages = async function () {
          var count = Module.ccall('doc_imported_image_count', 'number', [], []);
          for (var i = 0; i < count; ++i) {
            try {
              var pi   = Module.ccall('doc_imported_image_para', 'number', ['number'], [i]);
              var path = Module.ccall('doc_imported_image_path', 'string', ['number'], [i]);
              if (pi < 0 || !path) continue;
              var bytes = Module.FS.readFile(path);
              var blob  = new Blob([bytes]);
              var bmp   = await createImageBitmap(blob);
              var c = document.createElement('canvas');
              c.width = bmp.width; c.height = bmp.height;
              var ctx = c.getContext('2d');
              ctx.drawImage(bmp, 0, 0);
              var data = ctx.getImageData(0, 0, c.width, c.height).data;
              var ptr = Module._malloc(data.length);
              Module.HEAPU8.set(data, ptr);
              Module.ccall('doc_attach_image', null,
                           ['number', 'number', 'number', 'number'],
                           [pi, ptr, c.width, c.height]);
              Module._free(ptr);
              if (bmp.close) bmp.close();
            } catch (err) { console.log('image ' + i + ' failed: ' + err); }
          }
        };

        window.docPickDocx = function () {
          var inp = document.createElement('input');
          inp.type = 'file';
          inp.accept = '.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
          inp.style.position = 'fixed';
          inp.style.left = '-9999px';
          document.body.appendChild(inp);
          inp.onchange = function () {
            var f = inp.files && inp.files[0];
            document.body.removeChild(inp);
            if (f) window.__docxImport(f);
          };
          inp.click();
        };

        document.getElementById('docx-file-input').addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0];
          e.target.value = '';
          if (f) window.__docxImport(f);
        });

        window.pdfPick = function () {
          var el = document.getElementById('pdf-file-input');
          if (el) el.click();
        };

        // Image import for Docx editor
        document.getElementById('img-file-input').addEventListener('change', function(e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(evt) {
            var img = new Image();
            img.onload = function() {
              var c = document.createElement('canvas');
              c.width = img.width; c.height = img.height;
              var ctx = c.getContext('2d');
              ctx.drawImage(img, 0, 0);
              var id = ctx.getImageData(0, 0, img.width, img.height);
              var rgba = id.data;
              var ptr = Module._malloc(rgba.length);
              Module.HEAPU8.set(rgba, ptr);
              Module.ccall('doc_receive_image', null,
                ['number','number','number'], [ptr, img.width, img.height]);
              Module._free(ptr);
            };
            img.src = evt.target.result;
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });
      }
    };
    // ── SVG → raster → document image ──────────────────────────────────────
    // Shared by the diagram builder and the LaTeX math inserter.
    function svgIntrinsicSize(svgText) {
      const vb = /viewBox="([-\d.]+)[ ,]+([-\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)"/.exec(svgText);
      const wPx = /<svg[^>]*\swidth="([\d.]+)(px)?"(?=[\s>\/])/.exec(svgText);
      const hPx = /<svg[^>]*\sheight="([\d.]+)(px)?"(?=[\s>\/])/.exec(svgText);
      if (wPx && hPx) return { w: parseFloat(wPx[1]), h: parseFloat(hPx[1]), units: 'px' };
      if (vb) return { w: parseFloat(vb[3]), h: parseFloat(vb[4]), units: 'vb' };
      return { w: 900, h: 600, units: 'none' };
    }

    async function insertSvgImage(svgText, scaleHint) {
      const sz = svgIntrinsicSize(svgText);
      let scale = scaleHint || (sz.units === 'px' ? Math.min(2, 2400 / Math.max(sz.w, sz.h)) : 1.4);
      if (sz.units === 'vb') scale = scaleHint || 1.4;
      let cw = Math.max(1, Math.round(sz.w * scale));
      let ch = Math.max(1, Math.round(sz.h * scale));
      if (!/<svg[^>]*\swidth=/.test(svgText) || sz.units !== 'px') {
        svgText = svgText.replace(/<svg([^>]*)>/, function (m, a) {
          return '<svg' + a + ' width="' + sz.w + '" height="' + sz.h + '" xmlns="http://www.w3.org/2000/svg">';
        });
      }
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
      await new Promise(function (res, rej) { img.onload = res; img.onerror = rej; });

      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);

      const data = ctx.getImageData(0, 0, cw, ch).data;
      const ptr = Module._malloc(data.length);
      Module.HEAPU8.set(data, ptr);
      Module.ccall('doc_receive_image', null, ['number', 'number', 'number'], [ptr, cw, ch]);
      Module._free(ptr);
      console.log('inserted image ' + cw + 'x' + ch);
    }

    // ── Diagram rendering: Mermaid / Graphviz → PNG → document image ───────
    window.renderDiagram = async function (kind, src) {
      try {
        let svgText = '';
        let scale = 1.6;
        if (kind === 0) {
          const mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;
          mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose',
                               flowchart: { htmlLabels: false, useMaxWidth: false } });
          const res = await mermaid.render('dgm' + Date.now(), src);
          svgText = res.svg;
          scale = 2;
        } else {
          const vizMod = await import('https://cdn.jsdelivr.net/npm/@viz-js/viz@3/lib/viz-standalone.mjs');
          const viz = await vizMod.instance();
          svgText = viz.renderString(src, { format: 'svg', engine: 'dot' });
          scale = 1.6;
        }
        await insertSvgImage(svgText, scale);
      } catch (e) {
        console.error('renderDiagram failed', e);
        alert('Diagram rendering failed: ' + (e && e.message ? e.message : e));
      }
    };

    // ── LaTeX math via MathJax (SVG output, no external fonts) ─────────────
    window.renderMath = async function (tex) {
      try {
        if (!window.MathJax || !window.MathJax.tex2svgPromise) {
          await new Promise(function (res, rej) {
            const sc = document.createElement('script');
            sc.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';
            sc.onload = res;
            sc.onerror = function () { rej(new Error('could not load MathJax')); };
            document.head.appendChild(sc);
          });
          if (window.MathJax && window.MathJax.startup && MathJax.startup.promise)
            await MathJax.startup.promise;
        }
        const node = await MathJax.tex2svgPromise(tex, { display: true });
        const svgEl = node.querySelector('svg');
        if (!svgEl) throw new Error('MathJax returned no SVG');
        const svg = new XMLSerializer().serializeToString(svgEl);
        // MathJax viewBox units are 1/1000 em → ~0.12 px per unit
        await insertSvgImage(svg, 0.13);
      } catch (e) {
        console.error('renderMath failed', e);
        alert('LaTeX rendering failed: ' + (e && e.message ? e.message : e));
      }
    };

    window.onerror = function(msg) { console.error('onerror:', msg); };
  </script>
  <!-- PDF: parsed and rasterized natively in C++ (pdf/pdfdoc.cpp + pdf/pdfraster.cpp).
       The only JS left is the file picker -> wasm heap handoff. -->
  <script>
    (function () {
      window.pdfOpenFromBuffer = function (buffer, name) {
        if (!window.Module || !Module._malloc) return -1;
        var bytes = new Uint8Array(buffer);
        var ptr = Module._malloc(bytes.length);
        if (!ptr) return -1;
        Module.HEAPU8.set(bytes, ptr);
        var n = Module.ccall('pdf_open_document', 'number', ['number', 'number'], [ptr, bytes.length]);
        Module._free(ptr);
        console.log('pdf_open_document(' + (name || '') + ') -> ' + n + ' pages');
        return n;
      };

      document.getElementById('pdf-file-input').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (evt) { window.pdfOpenFromBuffer(evt.target.result, file.name); };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      });
    })();
  </script>
  {{{ SCRIPT }}}
  <style>
    #mobile-files { display: none; }
    @media (max-width: 840px) {
      #mobile-files {
        display: flex; gap: 6px; position: fixed; right: 8px; bottom: 12px; z-index: 99999;
      }
      #mobile-files label {
        background: #2f6fed; color: #fff; font: 600 12px/1.2 system-ui, sans-serif;
        padding: 7px 10px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
  </style>
  <div id="mobile-files">
    <label for="docx-file-input">Open .docx</label>
    <label for="pdf-file-input">Open PDF</label>
  </div>
</body>
</html>
